<title>Evolve Your World Characters</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Rubik:wght@400;500;700&display=swap">
<style>
/* Layout: one big 3D stage like a Roblox showcase, character chips above it, stats card below. Single dark "night arcade" look on purpose. */
:root {
  --bg: #0d0b1a; --panel: #17142b; --line: #2c2650; --fg: #f3f0ff; --muted: #a9a2cc;
  --gold: #ffd34d; --green: #6dff8f; --red: #ff3b4e;
  --display: "Fredoka", "Rubik", system-ui, sans-serif; --body: "Rubik", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); margin: 0; }
.wrap { max-width: 980px; margin: 0 auto; padding-block: 14px 28px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 14px; }
header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; justify-content: space-between; }
h1 { font-family: var(--display); font-weight: 700; font-size: clamp(22px, 5vw, 34px); margin: 0; letter-spacing: .5px; text-wrap: balance; }
h1 span { color: var(--gold); }
.sub { color: var(--muted); font-size: 14px; margin: 0; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
.chip { flex: 0 0 auto; border: 2px solid var(--line); background: var(--panel); color: var(--fg); font: 500 14px var(--body); padding: 8px 12px; border-radius: 999px; cursor: pointer; display: flex; gap: 6px; align-items: center; }
.chip i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.chip[aria-pressed="true"] { border-color: var(--gold); background: #2a2148; }
.chip:focus-visible, .btn:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.stage { position: relative; border-radius: 22px; overflow: hidden; border: 2px solid var(--line); background: radial-gradient(ellipse at 50% 30%, #2a2156 0%, #110e22 70%); aspect-ratio: 4 / 3.4; max-width: 100%; touch-action: none; }
canvas { width: 100%; height: 100%; display: block; }
.tag { position: absolute; inset: 14px 14px auto 14px; display: grid; justify-items: center; text-align: center; pointer-events: none; }
.tag b { font-family: var(--display); font-size: clamp(20px, 4.6vw, 30px); text-shadow: 0 2px 0 #000, 0 0 12px #000; }
.tag em { font-style: normal; font-family: var(--display); font-weight: 700; font-size: 16px; text-shadow: 0 2px 0 #000; }
.tag .p { color: var(--gold); font-family: var(--display); font-size: 17px; text-shadow: 0 2px 0 #000; }
.tag .inc { color: var(--green); font-family: var(--display); font-size: 15px; text-shadow: 0 2px 0 #000; }
.ctrls { position: absolute; bottom: 12px; inset-inline: 12px; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.btn { border: 0; border-radius: 12px; padding: 9px 14px; font: 700 14px var(--body); background: #ffffff1c; color: var(--fg); cursor: pointer; backdrop-filter: blur(6px); }
.btn[aria-pressed="true"] { background: var(--gold); color: #241a00; }
.card { background: var(--panel); border: 2px solid var(--line); border-radius: 18px; padding: 16px; display: grid; gap: 12px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.stat { display: grid; gap: 2px; }
.stat span { color: var(--muted); font-size: 12px; letter-spacing: .4px; }
.stat strong { font-family: var(--display); font-size: 20px; font-variant-numeric: tabular-nums; }
.row { display: grid; gap: 4px; }
.row span { color: var(--muted); font-size: 12px; letter-spacing: .4px; }
.row p { margin: 0; line-height: 1.55; max-width: 65ch; }
.note { color: var(--muted); font-size: 13px; line-height: 1.5; margin: 0; }
@media (prefers-reduced-motion: reduce) { .chip, .btn { transition: none; } }
</style>

<div class="wrap" dir="rtl">
  <header>
    <h1>EVOLVE <span>YOUR WORLD</span></h1>
    <p class="sub">12 הדמויות, בנויות מאותו קוד שנכנס לרובלוקס</p>
  </header>
  <div class="chips" id="chips" role="toolbar" aria-label="בחירת דמות"></div>
  <div class="stage" id="stage">
    <canvas id="c" aria-label="תצוגת דמות בתלת־ממד"></canvas>
    <div class="tag" dir="ltr"><b id="tName"></b><em id="tRar"></em><span class="p" id="tPrice"></span><span class="inc" id="tInc"></span></div>
    <div class="ctrls">
      <button class="btn" id="bWalk" aria-pressed="true">הולך</button>
      <button class="btn" id="bSpin" aria-pressed="true">מסתובב</button>
      <button class="btn" id="bFront">מקדימה</button>
    </div>
  </div>
  <section class="card" aria-live="polite">
    <div class="stats">
      <div class="stat"><span>נדירות</span><strong id="sRar"></strong></div>
      <div class="stat"><span>מחיר</span><strong id="sPrice" dir="ltr"></strong></div>
      <div class="stat"><span>רווח לשנייה</span><strong id="sInc" dir="ltr"></strong></div>
      <div class="stat"><span>סיכוי לצאת</span><strong id="sChance" dir="ltr"></strong></div>
    </div>
    <div class="row"><span>איך הוא הולך</span><p id="sWalk"></p></div>
    <div class="row"><span>מה קורה בכדור</span><p id="sSphere"></p></div>
  </section>
  <p class="note">גוררים על התמונה כדי לסובב. בתצוגה הזאת אין אפקטים של חלקיקים (נצנצים, עשן, פתיתי שלג). הם נראים רק בתוך רובלוקס.</p>
</div>

function mesh(pos, nor, idx) {

function sphere() { const P=[],N=[],I=[], S=20, R=14;

// ---------- gait (same as Gait.luau) ----------
const STRIDE = { cute:1.15, strut:.95, bully:.9, skip:.7, tiny:2, quad:.75, dragon:.6, phone:1, limp:.9, potion:1 };

    set("Head", A(sin(ph*2)*.05*a+sin(tt*.9)*.04, sin(tt*.7)*.12, 0)); set("Neck", A(sin(tt*1.1)*.05,0,0));

  else if (g==="strut"){ legAmp=.55; armAmp=.85; bounce=.12; body=A(-.08*a, sin(ph)*.12*a, sin(ph)*.06*a); head=M.mul(head,A(-.08*a,0,0)); }

// ---------- character ----------
let cur = null, ids = Object.keys(CHARS);
function load(id) {
  const c = CHARS[id]; const jp = { HumanoidRootPart: [0, c.hip, 0] }; const jpar = {};
  c.joints.forEach(j => { jp[j.name] = j.p; jpar[j.name] = j.parent; });
  let minY = 1e9, maxY = -1e9, maxR = 0;
  const parts = c.parts.map(p => {
    const q = jp[p.j] || [0,0,0];
    let local = M.mul(M.t(-q[0],-q[1],-q[2]), M.cf(p.r, p.p));
    local = M.mul(local, M.s(p.s === "Ball" ? p.sz[0] : p.sz[0], p.s === "Ball" ? p.sz[0] : p.sz[1], p.s === "Ball" ? p.sz[0] : p.sz[2]));
    const top = p.p[1] + Math.max(...p.sz)/2, bot = p.p[1] - Math.max(...p.sz)/2;
    if (p.t < 0.95) { minY = Math.min(minY, bot); maxY = Math.max(maxY, top); maxR = Math.max(maxR, Math.hypot(p.p[0], p.p[2]) + Math.max(...p.sz)/2); }
    const neon = p.m === "Neon", glass = p.m === "Glass";
    return { j: p.j, mesh: MESH[p.s] || MESH.Block, local, col: p.c, alpha: Math.min(1 - p.t, glass ? 0.82 : 1), neon: neon ? 1 : 0, spec: (p.m === "Metal" || glass || p.m === "DiamondPlate") ? 0.9 : 0.18 };
  });
  cur = { id, c, jp, jpar, parts, minY: Math.max(0, minY), maxY, maxR };
  st.phase = 0;
  const info = INFO[id];
  document.getElementById("tName").textContent = info.name;
  const tr = document.getElementById("tRar"); tr.textContent = info.rarity; tr.style.color = info.rc;
  document.getElementById("tPrice").textContent = info.price;
  document.getElementById("tInc").textContent = info.income + "/s";
  document.getElementById("sRar").textContent = info.rarity; document.getElementById("sRar").style.color = info.rc;
  document.getElementById("sPrice").textContent = info.price; document.getElementById("sInc").textContent = info.income;
  document.getElementById("sChance").textContent = info.chance + "%";
  document.getElementById("sWalk").textContent = info.walk; document.getElementById("sSphere").textContent = info.sphere;
  document.querySelectorAll(".chip").forEach(b => b.setAttribute("aria-pressed", b.dataset.id === id ? "true" : "false"));
}
const chips = document.getElementById("chips");
ids.forEach(id => { const b = document.createElement("button"); b.className = "chip"; b.dataset.id = id; b.type = "button";
  b.innerHTML = `<i style="background:${INFO[id].rc}"></i>`; b.append(INFO[id].name); b.onclick = () => load(id); chips.append(b); });

// ---------- controls ----------
let walking = true, spinning = true, yaw = 0.6, pitch = 0.18, drag = null;
const bW = document.getElementById("bWalk"), bS = document.getElementById("bSpin");
bW.onclick = () => { walking = !walking; bW.setAttribute("aria-pressed", walking); bW.textContent = walking ? "הולך" : "עומד"; };
bS.onclick = () => { spinning = !spinning; bS.setAttribute("aria-pressed", spinning); };
document.getElementById("bFront").onclick = () => { yaw = 0; pitch = 0.12; spinning = false; bS.setAttribute("aria-pressed", false); };
cv.addEventListener("pointerdown", e => { drag = [e.clientX, e.clientY]; cv.setPointerCapture(e.pointerId); spinning = false; bS.setAttribute("aria-pressed", false); });
cv.addEventListener("pointermove", e => { if (!drag) return; yaw -= (e.clientX - drag[0]) * 0.01; pitch = Math.max(-0.2, Math.min(1.1, pitch + (e.clientY - drag[1]) * 0.006)); drag = [e.clientX, e.clientY]; });
cv.addEventListener("pointerup", () => drag = null);
if (matchMedia("(prefers-reduced-motion: reduce)").matches) { spinning = false; bS.setAttribute("aria-pressed", false); }

// ---------- floor ----------
const floorParts = [];
(function () { const ring = (d, h, y, col, neon) => floorParts.push({ mesh: MESH.Cylinder, m: M.mul(M.mul(M.t(0, y, 0), M.rz(Math.PI/2)), M.s(h, d, d)), col, neon, alpha: 1, spec: .2 });
  ring(9.5, .3, -.15, [.16,.13,.3], 0); ring(9.9, .2, -.2, [1,.83,.3], 1); })();

// ---------- render ----------
let last = performance.now(), T0 = last;
function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.05); last = now; const t = (now - T0) / 1000;
  const w = cv.clientWidth * devicePixelRatio, h = cv.clientHeight * devicePixelRatio;
  if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
  gl.viewport(0, 0, w, h); gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT); gl.enable(gl.DEPTH_TEST);

  const get = n => { if (world[n]) return world[n]; const par = c.jpar[n] || "HumanoidRootPart"; const pp = c.jp[par], p = c.jp[n];
    world[n] = M.mul(M.mul(get(par), M.t(p[0]-pp[0], p[1]-pp[1], p[2]-pp[2])), T[n] || M.id()); return world[n]; };

    gl.bindBuffer(gl.ARRAY_BUFFER, mesh.b1); gl.enableVertexAttribArray(aP); gl.vertexAttribPointer(aP, 3, gl.FLOAT, false, 0, 0);
    gl.bindBuffer(gl.ARRAY_BUFFER, mesh.b2); gl.enableVertexAttribArray(aN); gl.vertexAttribPointer(aN, 3, gl.FLOAT, false, 0, 0);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, mesh.b3); gl.drawElements(gl.TRIANGLES, mesh.n, gl.UNSIGNED_SHORT, 0); };
  gl.disable(gl.BLEND); gl.depthMask(true);

    if (p.alpha < 0.99) trans.push([m, p]); else draw(p.mesh, m, p.col, 1, p.neon, p.spec); }

  trans.forEach(([m, p]) => draw(p.mesh, m, p.col, p.alpha, p.neon, p.spec));

}
load(location.hash.slice(1) in CHARS ? location.hash.slice(1) : ids[0]);
requestAnimationFrame(frame);
</script>
